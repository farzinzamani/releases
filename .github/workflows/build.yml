name: Build TradeMind
on: [push]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: \'3.22.0\' }
      - run: cd app_flutter && flutter pub get && dart run flutter_launcher_icons
      - run: cd app_flutter && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TradeMind-Android-APK
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: \'3.22.0\' }
      - run: cd app_flutter && flutter pub get && dart run flutter_launcher_icons
      - run: cd app_flutter && flutter config --enable-windows-desktop && flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: TradeMind-Windows-EXE
          path: app_flutter/build/windows/x64/runner/Release/
